<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta Selo — Áreas e Atividades por Município</title>
<style>
  :root {
    --bg: #F5F3EC;
    --panel: #FFFFFF;
    --ink: #1E3A34;
    --ink-soft: #4B6359;
    --line: #DDD8C8;
    --accent: #1F6F5C;
    --accent-dark: #164F41;
    --accent-soft: #E4EFE9;
    --amber: #C97A2B;
    --clay: #B4552F;
    --radius: 10px;
    --serif: 'Iowan Old Style', 'Palatino Linotype', 'URW Palladio', Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.5;
    min-height: 100vh;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  header.top { margin-bottom: 36px; }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--accent-dark);
    font-size: 13px;
    letter-spacing: 0.02em;
    margin-bottom: 10px;
  }

  .eyebrow .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--amber);
    flex: none;
  }

  h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 32px;
    line-height: 1.2;
    margin: 0 0 12px;
    color: var(--accent-dark);
    max-width: 18ch;
  }

  .lede {
    color: var(--ink-soft);
    font-size: 15.5px;
    max-width: 52ch;
    margin: 0;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 28px;
    margin-top: 28px;
  }

  .field { margin-bottom: 20px; }
  .field:last-child { margin-bottom: 0; }

  .field label {
    display: block;
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 7px;
  }

  select {
    width: 100%;
    font-family: var(--sans);
    font-size: 16px;
    padding: 12px 14px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background-color: #FCFBF7;
    color: var(--ink);
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1L7 7L13 1' stroke='%234B6359' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat: no-repeat;
    background-position: right 14px center;
    padding-right: 36px;
    cursor: pointer;
  }

  select:disabled {
    color: #9AA6A0;
    cursor: not-allowed;
    background-color: #F2F1EA;
  }

  select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .hint { font-size: 12.5px; color: #8A9690; margin-top: 6px; }
  .hint.warn { color: var(--clay); }

  #result { margin-top: 28px; }

  .result-card {
    border-top: 1px solid var(--line);
    padding-top: 24px;
    animation: rise 0.25s ease;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .muni-name {
    font-family: var(--serif);
    font-size: 27px;
    color: var(--accent-dark);
    margin: 0 0 6px;
  }

  .muni-uf { font-size: 15px; color: var(--ink-soft); margin: 0 0 26px; }

  .attr { margin-bottom: 22px; }
  .attr:last-child { margin-bottom: 0; }

  .attr-label {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 14px;
    color: var(--ink-soft);
    margin-bottom: 9px;
  }

  .swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }

  .attr-value { font-size: 19px; padding: 4px 0; }

  .area-pill {
    display: inline-block;
    padding: 7px 16px;
    border-radius: 999px;
    font-size: 17px;
    font-weight: 600;
    color: #fff;
  }

  .atividade-text { color: var(--ink); font-size: 18.5px; line-height: 1.6; }

  @media (max-width: 480px) {
    .wrap { padding: 32px 16px 60px; }
    h1 { font-size: 26px; }
    .card { padding: 20px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="eyebrow"><span class="dot"></span>Consulta por município</div>
    <h1>Área e atividade do Selo por município</h1>
    <p class="lede">Selecione o estado e o município para ver a área temática e a atividade recomendada no painel do Selo.</p>
  </header>

  <div class="card">
    <div class="field">
      <label for="uf">Estado (UF)</label>
      <select id="uf">
        <option value="">Selecione o estado…</option>
      </select>
    </div>

    <div class="field">
      <label for="municipio">Município</label>
      <select id="municipio" disabled>
        <option value="">Selecione o estado primeiro…</option>
      </select>
      <div class="hint" id="uf-hint"></div>
    </div>
  </div>

  <div id="result"></div>

</div>

  const UF_NAMES = {"AC": "Acre", "AL": "Alagoas", "AP": "Amapá", "AM": "Amazonas", "BA": "Bahia", "CE": "Ceará", "DF": "Distrito Federal", "ES": "Espírito Santo", "GO": "Goiás", "MA": "Maranhão", "MT": "Mato Grosso", "MS": "Mato Grosso do Sul", "MG": "Minas Gerais", "PA": "Pará", "PB": "Paraíba", "PR": "Paraná", "PE": "Pernambuco", "PI": "Piauí", "RJ": "Rio de Janeiro", "RN": "Rio Grande do Norte", "RS": "Rio Grande do Sul", "RO": "Rondônia", "RR": "Roraima", "SC": "Santa Catarina", "SP": "São Paulo", "SE": "Sergipe", "TO": "Tocantins"};
  const UF_ORDER = ["AC", "AP", "AM", "PA", "RO", "RR", "TO", "AL", "BA", "CE", "MA", "PB", "PE", "PI", "RN", "SE", "MT", "MG"];

  const AREA_COLORS = {
    "Qualidade do ar": "#005B71",
    "Infraestrutura": "#495C22",
    "Eventos extremos": "#812628",
    "Ambiente escolar": "#B06A22"
  };
  const AREA_LABELS = {
    "Infraestrutura": "Infraestrutura Ambiental e Urbana"
  };
  const DEFAULT_COLOR = "#1F6F5C";

  const ufSelect = document.getElementById('uf');
  const muniSelect = document.getElementById('municipio');
  const ufHint = document.getElementById('uf-hint');
  const resultEl = document.getElementById('result');

  UF_ORDER.forEach(function(code) {
    const opt = document.createElement('option');
    opt.value = code;
    const name = UF_NAMES[code] || code;
    opt.textContent = name + ' (' + code + ')';
    ufSelect.appendChild(opt);
  });

  function resetMuniSelect(message) {
    muniSelect.innerHTML = '';
    const opt = document.createElement('option');
    opt.value = '';
    opt.textContent = message;
    muniSelect.appendChild(opt);
    muniSelect.disabled = true;
  }

  function clearResult() {
    resultEl.innerHTML = '';
  }

  ufSelect.addEventListener('change', function() {
    const uf = ufSelect.value;
    clearResult();
    if (!uf) {
      resetMuniSelect('Selecione o estado primeiro…');
      ufHint.textContent = '';
      ufHint.classList.remove('warn');
      return;
    }
    const munis = DATA[uf];
    if (!munis || Object.keys(munis).length === 0) {
      resetMuniSelect('Nenhum município disponível para este estado');
      ufHint.textContent = 'Esta planilha não contém dados para ' + (UF_NAMES[uf] || uf) + '.';
      ufHint.classList.add('warn');
      return;
    }
    const names = Object.keys(munis).sort(function(a, b) { return a.localeCompare(b, 'pt-BR'); });
    muniSelect.innerHTML = '';
    const placeholder = document.createElement('option');
    placeholder.value = '';
    placeholder.textContent = 'Selecione o município…';
    muniSelect.appendChild(placeholder);
    names.forEach(function(name) {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      muniSelect.appendChild(opt);
    });
    muniSelect.disabled = false;
    ufHint.textContent = names.length + ' município' + (names.length === 1 ? '' : 's') + ' disponível' + (names.length === 1 ? '' : 'eis') + '.';
    ufHint.classList.remove('warn');
  });

  muniSelect.addEventListener('change', function() {
    const uf = ufSelect.value;
    const muni = muniSelect.value;
    if (!uf || !muni) { clearResult(); return; }
    const info = DATA[uf][muni];
    if (!info) { clearResult(); return; }
    const color = AREA_COLORS[info.area] || DEFAULT_COLOR;
    const areaLabel = AREA_LABELS[info.area] || info.area;
    resultEl.innerHTML =
      '<div class="result-card">' +
        '<p class="muni-name">' + muni + '</p>' +
        '<p class="muni-uf">' + (UF_NAMES[uf] || uf) + ' — ' + uf + '</p>' +
        '<div class="attr">' +
          '<div class="attr-label"><span class="swatch" style="background:' + color + '"></span>Área</div>' +
          '<div class="attr-value"><span class="area-pill" style="background:' + color + '">' + areaLabel + '</span></div>' +
        '</div>' +
        '<div class="attr">' +
          '<div class="attr-label"><span class="swatch" style="background:#8A9690"></span>Atividade</div>' +
          '<div class="attr-value atividade-text">' + info.atividade + '</div>' +
        '</div>' +
      '</div>';
  });

  resetMuniSelect('Selecione o estado primeiro…');
</script>
